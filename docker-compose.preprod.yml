name: paylive-preprod

services:
  postgres:
    image: postgres:16
    container_name: paylive_preprod_postgres
    restart: unless-stopped
    env_file:
      - .env.preprod
    ports:
      - "5434:5432"
    volumes:
      - postgres_preprod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
    container_name: paylive_preprod_api
    restart: unless-stopped
    env_file:
      - .env.preprod
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m uvicorn api.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    container_name: paylive_preprod_frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_preprod_data:
